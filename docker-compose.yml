services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Phase 2 profile. Not used in the CLI-only phase.
  api:
    profiles: ["api"]
    build: .
    command: ["uvicorn", "embbench.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
