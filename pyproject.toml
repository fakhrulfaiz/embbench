[project]
name = "embbench"
version = "0.1.0"
description = "Service-shaped embedding benchmark harness for retrieval (nDCG/Recall) and STS."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mteb>=2.19.5",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0,<6.0.0",
    "torch>=2.0.0",
    "datasets>=2.19.0",
    "numpy>=1.23,<3",
    "pytrec-eval-terrier>=0.5.6",
    "qdrant-client>=1.12.0",
    "typer>=0.15.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
embbench = "embbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embbench"]

[tool.hatch.build.targets.wheel.sources]
"src/embbench" = "embbench"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
